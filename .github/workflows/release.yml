name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Opt into Node.js 24 early — Actions will force this from 16 Jun 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target:   aarch64-apple-darwin
            os-dir:   macos
            label:    macOS-arm64
            libdiscon-keep: "*.dylib"

          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            os-dir:   windows
            label:    Windows-x64
            libdiscon-keep: "*.dll"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      # ── Source ─────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Frontend ───────────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── Python sidecar compilation ─────────────────────────────────────────────
      - name: Compile fws_io sidecar
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller \
            --onefile \
            --noconsole \
            --name fws_io \
            --distpath src-tauri/sidecar \
            src-tauri/sidecar/fws_io.py

      # ── Prepare OpenFAST + TurbSim binaries ────────────────────────────────────
      - name: Prepare OpenFAST + TurbSim binaries
        shell: bash
        run: |
          src="src-tauri/resources/bin/${{ matrix.os-dir }}"
          dst="src-tauri/resources/bin"
          cp "$src"/* "$dst/"
          rm -rf "$dst/macos" "$dst/windows" "$dst/linux"
          if [[ "${{ matrix.platform }}" != "windows-latest" ]]; then
            chmod +x "$dst/openfast" "$dst/turbsim"
          fi

      # ── Strip unused libdiscon variants ───────────────────────────────────────
      - name: Remove unused libdiscon variants
        shell: bash
        run: |
          keep="${{ matrix.libdiscon-keep }}"
          find src-tauri/resources/turbines \
            \( -name "libdiscon.dylib" -o -name "libdiscon.dll" -o -name "libdiscon.so" \) \
            ! -name "$keep" -delete

      # ── Build ──────────────────────────────────────────────────────────────────
      # macOS: build .app only — dmgbuild (below) creates the styled DMG headless.
      # Tauri's own DMG creator uses AppleScript/Finder which fails on CI runners.
      # Windows: build both MSI and NSIS installers as before.
      - name: Build Tauri app
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            npm run tauri build -- --target ${{ matrix.target }} --bundles app
          else
            npm run tauri build -- --target ${{ matrix.target }}
          fi

      # ── macOS: create styled DMG with dmgbuild ─────────────────────────────────
      # dmgbuild writes the .DS_Store directly — no AppleScript, no Finder needed.
      - name: Create styled DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          pip install dmgbuild
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/FlowWake Studio.app"
          BG="src-tauri/assets/dmg_background.png"
          SETTINGS="src-tauri/assets/dmg_settings.py"
          OUT_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$OUT_DIR"
          dmgbuild \
            -s "$SETTINGS" \
            -D "app=$APP" \
            -D "bg=$BG" \
            "FlowWake Studio" \
            "$OUT_DIR/FlowWake Studio_0.1.0_aarch64.dmg"

      # ── Upload artifact (all runs) ─────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowWake-Studio-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 7

      # ── Publish GitHub Release (tag pushes only) ───────────────────────────────
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: FlowWake Studio ${{ github.ref_name }}
          body: |
            ## FlowWake Studio ${{ github.ref_name }}

            Desktop GUI for OpenFAST and TurbSim — wind turbine aeroelastic simulation workflows.

            **Downloads**
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` |
            | Windows (64-bit) | `_x64-setup.exe` (NSIS) or `_x64_en-US.msi` (MSI) |

            **Bundled**: OpenFAST v4.2.0 · TurbSim v4.2.0 · ROSCO v2.10.1

            **Cite**
            ```
            Kalimullah, N. M. M. (2026). FlowWake Studio (v0.1.0).
            Zenodo. https://doi.org/10.5281/zenodo.XXXXXXX
            ```
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
