name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Opt into Node.js 24 early — Actions will force this from 16 Jun 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target:   aarch64-apple-darwin
            os-dir:   macos
            label:    macOS-arm64
            libdiscon-keep: "*.dylib"

          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            os-dir:   windows
            label:    Windows-x64
            libdiscon-keep: "*.dll"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      # ── Source ─────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Frontend ───────────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── Python sidecar compilation ─────────────────────────────────────────────
      - name: Compile fws_io sidecar
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller \
            --onefile \
            --noconsole \
            --name fws_io \
            --distpath src-tauri/sidecar \
            src-tauri/sidecar/fws_io.py

      # ── Prepare OpenFAST + TurbSim binaries ────────────────────────────────────
      - name: Prepare OpenFAST + TurbSim binaries
        shell: bash
        run: |
          src="src-tauri/resources/bin/${{ matrix.os-dir }}"
          dst="src-tauri/resources/bin"
          cp "$src"/* "$dst/"
          rm -rf "$dst/macos" "$dst/windows" "$dst/linux"
          if [[ "${{ matrix.platform }}" != "windows-latest" ]]; then
            chmod +x "$dst/openfast" "$dst/turbsim"
          fi

      # ── Strip unused libdiscon variants ───────────────────────────────────────
      - name: Remove unused libdiscon variants
        shell: bash
        run: |
          keep="${{ matrix.libdiscon-keep }}"
          find src-tauri/resources/turbines \
            \( -name "libdiscon.dylib" -o -name "libdiscon.dll" -o -name "libdiscon.so" \) \
            ! -name "$keep" -delete

      # ── macOS: import Developer ID certificate into a temporary keychain ───────
      # Gracefully skips when APPLE_CERTIFICATE secret is not yet configured.
      # To enable signing: export your Developer ID Application cert as a .p12,
      # base64-encode it (base64 -i cert.p12 | tr -d '\n'), and add the secrets
      # listed below in repo Settings → Secrets and variables → Actions.
      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:          ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set — building unsigned (add secret to enable signing)"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12
          # Add build.keychain to the search list so codesign can find the cert
          EXISTING=$(security list-keychains -d user | sed 's/"//g' | tr '\n' ' ')
          security list-keychains -d user -s build.keychain $EXISTING
          echo "Keychain search list:"
          security list-keychains -d user

      # ── Build ──────────────────────────────────────────────────────────────────
      # macOS: build .app only — dmgbuild (below) creates the styled DMG headless.
      # Windows: NSIS only — MSI is skipped (not needed for distribution).
      - name: Build Tauri app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            npm run tauri build -- --target ${{ matrix.target }} --bundles app
          else
            npm run tauri build -- --target ${{ matrix.target }} --bundles nsis
          fi

      # ── macOS: sign every bundled binary and dylib individually ───────────────
      # Apple's notarization requires each Mach-O inside the bundle to be signed
      # with a Developer ID cert + secure timestamp. Tauri's --deep flag signs
      # everything with the same cert, but does NOT propagate --options runtime to
      # nested executables. We sign from inner-out: dylibs first, then executables
      # in Resources/bin and Resources/sidecar, then re-sign the outer .app last.
      - name: Sign bundled binaries and dylibs
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY not set — skipping"
            exit 0
          fi
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/FlowUrja Studio.app"

          echo "=== Signing dylibs (.dylib / .so) ==="
          find "$APP" \( -name "*.dylib" -o -name "*.so" \) | while read -r f; do
            echo "  $f"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$f"
          done

          echo "=== Signing executables in Resources/bin and Resources/sidecar ==="
          for dir in "$APP/Contents/Resources/bin" "$APP/Contents/Resources/sidecar"; do
            [ -d "$dir" ] || continue
            find "$dir" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                echo "  $f"
                codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
                  --options runtime "$f"
              fi
            done
          done

          echo "=== Re-signing .app bundle (must be last — inner-out order) ==="
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            --options runtime \
            --entitlements "src-tauri/entitlements.plist" \
            "$APP"

      # ── macOS: verify the .app is properly signed before packaging ────────────
      - name: Verify app code signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/FlowUrja Studio.app"
          echo "=== Signature info ==="
          codesign --display --verbose=4 "$APP" 2>&1 || echo "WARNING: codesign --display failed"
          echo "=== Signature verification ==="
          codesign --verify --deep --strict "$APP" \
            && echo "Signature OK" \
            || echo "WARNING: signature invalid — notarization will likely fail"

      # ── macOS: create styled DMG with dmgbuild ─────────────────────────────────
      # dmgbuild writes the .DS_Store directly — no AppleScript, no Finder needed.
      - name: Create styled DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          pip install dmgbuild
          VERSION=$(node -p "require('./package.json').version")
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/FlowUrja Studio.app"
          BG="src-tauri/assets/dmg_background.png"
          SETTINGS="src-tauri/assets/dmg_settings.py"
          OUT_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$OUT_DIR"
          dmgbuild \
            -s "$SETTINGS" \
            -D "app=$APP" \
            -D "bg=$BG" \
            "FlowUrja Studio" \
            "$OUT_DIR/FlowUrja Studio_${VERSION}_aarch64.dmg"

      # ── macOS: sign, notarize, and staple the DMG ─────────────────────────────
      # Gracefully skips when Apple ID credentials are not yet configured.
      # Requires: APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
      #           APPLE_TEAM_ID — all as repo secrets.
      - name: Notarize and staple DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:               ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:         ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:          ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "APPLE_ID not set — skipping notarization (add secrets to enable)"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          DMG="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/FlowUrja Studio_${VERSION}_aarch64.dmg"

          # Verify the DMG exists before attempting to sign/submit
          if [ ! -f "$DMG" ]; then
            echo "ERROR: DMG not found at: $DMG"
            echo "Contents of bundle/dmg/:"
            ls -lh "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/" || true
            exit 1
          fi
          echo "=== Notarizing: $DMG ($(du -sh "$DMG" | cut -f1)) ==="

          # Sign the DMG container itself (the .app inside is already signed)
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"

          # Submit to Apple notary service.
          # Capture exit code manually so set -e doesn't kill the script before
          # we can print diagnostic output on failure.
          SUBMIT_EXIT=0
          NOTARY_JSON=$(xcrun notarytool submit "$DMG" \
            --apple-id  "$APPLE_ID"       \
            --password  "$APPLE_PASSWORD" \
            --team-id   "$APPLE_TEAM_ID"  \
            --wait --output-format json 2>&1) || SUBMIT_EXIT=$?
          echo "$NOTARY_JSON"
          if [ "$SUBMIT_EXIT" -ne 0 ]; then
            echo "ERROR: notarytool submit exited with code $SUBMIT_EXIT (credentials or network issue)"
            exit 1
          fi

          SUB_ID=$(echo "$NOTARY_JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          STATUS=$(echo "$NOTARY_JSON" | python3 -c \
            "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
          echo "=== Notarization status: '$STATUS' (submission id: '$SUB_ID') ==="

          # Always fetch the full Apple log — it lists every rejected binary/entitlement
          if [ -n "$SUB_ID" ]; then
            echo "=== Notarization log (id: $SUB_ID) ==="
            xcrun notarytool log "$SUB_ID" \
              --apple-id  "$APPLE_ID"       \
              --password  "$APPLE_PASSWORD" \
              --team-id   "$APPLE_TEAM_ID" 2>&1 || true
          fi

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization rejected (status=$STATUS) — see log above for the exact issues"
            exit 1
          fi
          # Staple the notarization ticket so users don't need internet at install time
          xcrun stapler staple "$DMG"

      # ── macOS: clean up temporary build keychain ───────────────────────────────
      - name: Remove build keychain
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: security delete-keychain build.keychain 2>/dev/null || true

      # ── Stage installer files flat (no subfolder nesting in artifact zip) ────
      - name: Stage installer files
        shell: bash
        run: |
          mkdir -p staging
          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
            \( -name "*.dmg" -o -name "*-setup.exe" \) \
            -exec cp {} staging/ \;
          ls -lh staging/

      # ── Upload artifact (all runs) ─────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowUrja-Studio-${{ matrix.label }}
          path: staging/
          retention-days: 7

      # ── Publish GitHub Release (tag pushes only) ───────────────────────────────
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: FlowUrja Studio ${{ github.ref_name }}
          body: |
            ## FlowUrja Studio ${{ github.ref_name }}

            Desktop GUI for OpenFAST and TurbSim — wind turbine aeroelastic simulation workflows.

            **Downloads**
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` |
            | Windows (64-bit) | `_x64-setup.exe` |

            **Bundled**: OpenFAST v4.2.0 · TurbSim v4.2.0 · ROSCO v2.10.1

            **Cite**
            For citation information please visit [www.flowurjastudio.com](https://www.flowurjastudio.com).
          files: staging/*
