name: Release

on:
  # Tag push triggers a full release draft (all platforms)
  push:
    tags:
      - 'v*'
  # Manual trigger — builds all platforms (macOS + Windows)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target:   aarch64-apple-darwin
            os-dir:   macos
            label:    macOS-arm64
            libdiscon-name: libdiscon.dylib
            libdiscon-keep: "*.dylib"

          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            os-dir:   windows
            label:    Windows-x64
            libdiscon-name: libdiscon.dll
            libdiscon-keep: "*.dll"

          # Linux: no pre-built OpenFAST binaries from NREL for v4.2.0.
          # Linux HPC users typically have OpenFAST installed system-wide;
          # FlowWake Studio falls back to the system binary automatically.
          # Re-enable when a bundled Linux binary is available.
          # - platform: ubuntu-22.04
          #   target:   x86_64-unknown-linux-gnu
          #   os-dir:   linux
          #   label:    Linux-x64
          #   libdiscon-name: libdiscon.so
          #   libdiscon-keep: "*.so"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      # ── Source ─────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Frontend ───────────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── Python sidecar compilation ─────────────────────────────────────────────
      # fws_io.py uses only stdlib — no extra pip deps needed.
      # PyInstaller produces a single-file binary; no Python required on user machine.
      - name: Compile fws_io sidecar
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller \
            --onefile \
            --name fws_io \
            --distpath src-tauri/sidecar \
            src-tauri/sidecar/fws_io.py

      # ── Prepare OpenFAST + TurbSim binaries ────────────────────────────────────
      # Binaries are committed in resources/bin/<os-dir>/.
      # Copy the target platform's binaries to bin/ root, remove subdirs so
      # Tauri's "resources/bin/*" glob only bundles the correct platform files.
      - name: Prepare OpenFAST + TurbSim binaries
        shell: bash
        run: |
          src="src-tauri/resources/bin/${{ matrix.os-dir }}"
          dst="src-tauri/resources/bin"
          cp "$src"/* "$dst/"
          rm -rf "$dst/macos" "$dst/windows" "$dst/linux"
          if [[ "${{ matrix.platform }}" != "windows-latest" ]]; then
            chmod +x "$dst/openfast" "$dst/turbsim"
          fi

      # ── Strip unused libdiscon variants ───────────────────────────────────────
      # Keep only the variant matching this platform; remove the rest.
      - name: Remove unused libdiscon variants
        shell: bash
        run: |
          keep="${{ matrix.libdiscon-keep }}"
          find src-tauri/resources/turbines \
            \( -name "libdiscon.dylib" -o -name "libdiscon.dll" -o -name "libdiscon.so" \) \
            ! -name "$keep" -delete

      # ── Build ──────────────────────────────────────────────────────────────────
      - name: Build Tauri app
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }}

      # ── Upload artifact (all runs) ─────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowWake-Studio-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 7

      # ── Publish GitHub Release (tag pushes only) ───────────────────────────────
      # Apple signing: add secrets to repo Settings → Secrets once enrolled in
      # the Apple Developer Program, then uncomment the env block below.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: FlowWake Studio ${{ github.ref_name }}
          body: |
            ## FlowWake Studio ${{ github.ref_name }}

            Desktop GUI for OpenFAST and TurbSim — wind turbine aeroelastic simulation workflows.

            **Downloads**
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` |
            | Windows (64-bit) | `_x64-setup.exe` (NSIS) or `_x64_en-US.msi` (MSI) |

            **Bundled**: OpenFAST v4.2.0 · TurbSim v4.2.0 · ROSCO v2.10.1

            **Cite**
            ```
            Kalimullah, N. M. M. (2026). FlowWake Studio (v0.1.0).
            Zenodo. https://doi.org/10.5281/zenodo.XXXXXXX
            ```
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
